version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ibero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/000_schema.sql:/docker-entrypoint-initdb.d/000_schema.sql:ro

  identity-service:
    build:
      context: ../services/identity-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ibero
    ports:
      - '8001:8080'
    depends_on: [db]

  facematch-service:
    build:
      context: ../services/facematch-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ibero
    ports:
      - '8002:8080'
    depends_on: [db]

  access-service:
    build:
      context: ../services/access-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ibero
    ports:
      - '8003:8080'
    depends_on: [db]

  migration-service:
    build:
      context: ../services/migration-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ibero
    ports:
      - '8004:8080'
    depends_on: [db]

  notifier-service:
    build:
      context: ../services/notifier-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ibero
    ports:
      - '8005:8080'
    depends_on: [db]

volumes:
  postgres_data:
